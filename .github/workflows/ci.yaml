name: CI/CD Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  test-and-lint:
    name: Test & Lint Go Microservice
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify Dependencies
        run: go mod verify

      - name: Run Tests with Coverage
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./app/...

      - name: Go Vet
        run: go vet ./app/...

  validate-manifests:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install YAML parser
        run: python3 -m pip install PyYAML==6.0.3

      - name: Validate YAML Syntax
        run: |
          python3 -c "
          import yaml, glob
          for f in glob.glob('k8s/*.yaml'):
              with open(f) as fp:
                  list(yaml.safe_load_all(fp))
              print(f'✓ Valid YAML: {f}')
          "

      - name: Validate Kustomize Build
        run: |
          kubectl kustomize ./k8s

  build-and-push:
    name: Multi-Arch Container Build & Push
    needs: [test-and-lint, validate-manifests]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/devops-flex-api
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.sha }}

      - name: Build and Push Multi-Arch Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./app/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Promote built image in GitOps manifest
        run: |
          sed -i "s|image: ghcr.io/shipitdev/devops-flex-api:.*|image: ghcr.io/shipitdev/devops-flex-api:${GITHUB_SHA}|" k8s/deployment.yaml
          git add k8s/deployment.yaml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Pin app image to ${GITHUB_SHA}"
          git push origin HEAD:master
