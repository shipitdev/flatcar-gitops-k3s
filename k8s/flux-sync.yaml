apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flatcar-gitops-k3s
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/shipitdev/flatcar-gitops-k3s
  ref:
    branch: master
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flatcar-gitops-k3s
  namespace: flux-system
spec:
  interval: 1m
  path: ./k8s
  prune: true
  sourceRef:
    kind: GitRepository
    name: flatcar-gitops-k3s
