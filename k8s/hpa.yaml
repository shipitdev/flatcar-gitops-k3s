apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: devops-flex-api-hpa
  namespace: default
  labels:
    app: devops-flex-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: devops-flex-api
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
