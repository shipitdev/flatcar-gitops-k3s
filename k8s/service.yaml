apiVersion: v1
kind: Service
metadata:
  name: devops-flex-api
  namespace: default
  labels:
    app: devops-flex-api
    app.kubernetes.io/name: devops-flex-api
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app: devops-flex-api
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  - name: metrics
    port: 8080
    targetPort: 8080
    protocol: TCP
